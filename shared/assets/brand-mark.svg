    <linearGradient id="brand-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c63ff"/>
      <stop offset="0.55" stop-color="#4a3fd1"/>
      <stop offset="1" stop-color="#22d3ee"/>
