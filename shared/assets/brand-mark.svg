  </defs>
  <rect width="128" height="128" rx="22" fill="url(#brand-grad)"/>
  <circle cx="88" cy="39" r="7" fill="#ffffff"/>
  <path d="M27 98 L55 56 L72 76 L81 66 L96 98 Z" fill="#ffffff"/>
</svg>
