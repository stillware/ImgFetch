<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark light">
  <title data-i18n="info_subtitle">ImgFetch, Image info</title>
  <script src="../shared/theme-init.js"></script>
  <link rel="stylesheet" href="../shared/ui.css">
  <style>
    body { max-width: 640px; margin: 0 auto; padding: 28px 20px 60px; }
    /* Brand header: larger mark, same shared .brand component as the editor. */
    .brand-mark { width: 40px; height: 40px; border-radius: 11px; }
    .brand-name { font-size: 18px; }
    .preview { width: 100%; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); max-height: 340px; object-fit: contain; }
    /* Definition list, same pattern as the popup preview (popup.html). */
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; margin: 12px 0; }
    .kv dt { color: var(--muted); }
    .kv dd { margin: 0; word-break: break-all; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
    input.link { font-family: ui-monospace, monospace; font-size: 12px; }
  </style>
</head>
<body>
  <div class="brand" style="margin-bottom:16px;">
    <img class="brand-mark" src="../shared/assets/brand-mark.svg" alt="" aria-hidden="true">
    <div>
      <div class="brand-name">ImgFetch</div>
      <div class="brand-sub" data-i18n="info_subtitle">Image info</div>
    </div>
  </div>

  <div id="loading" class="empty">
    <div class="spinner" role="status" data-i18n-attr="aria-label:ui_loading" aria-label="Loading"></div>
    <p data-i18n="info_loading">Reading image details…</p>
  </div>

  <div id="content" hidden>
    <div class="card">
      <img id="preview" class="preview" data-i18n-attr="alt:preview_imagePreview" alt="Image preview">
      <dl class="kv" id="kv"></dl>
      <div class="field" style="margin-top:12px;">
        <label for="link" data-i18n="info_directLink">Direct link</label>
        <input type="text" id="link" class="link" readonly>
      </div>
      <div class="actions">
        <button id="btnDownload" class="btn btn-primary" type="button"><svg class="icon icon-16" aria-hidden="true"><use href="../shared/assets/lucide-sprite.svg#download"/></svg> <span data-i18n="popup_qualitySmart">Smart Download</span></button>
        <button id="btnCopy" class="btn btn-ghost" type="button"><svg class="icon icon-16" aria-hidden="true"><use href="../shared/assets/lucide-sprite.svg#copy"/></svg> <span data-i18n="info_copyLink">Copy link</span></button>
        <button id="btnPng" class="btn btn-ghost" type="button"><svg class="icon icon-16" aria-hidden="true"><use href="../shared/assets/lucide-sprite.svg#file-text"/></svg> <span data-i18n="preview_savePng">Save as PNG</span></button>
        <button id="btnJpg" class="btn btn-ghost" type="button"><svg class="icon icon-16" aria-hidden="true"><use href="../shared/assets/lucide-sprite.svg#file-text"/></svg> <span data-i18n="preview_saveJpeg">Save as JPG</span></button>
        <button id="btnWebp" class="btn btn-ghost" type="button"><svg class="icon icon-16" aria-hidden="true"><use href="../shared/assets/lucide-sprite.svg#file-text"/></svg> <span data-i18n="preview_saveWebp">Save as WebP</span></button>
        <button id="btnAvif" class="btn btn-ghost" type="button"><svg class="icon icon-16" aria-hidden="true"><use href="../shared/assets/lucide-sprite.svg#file-text"/></svg> <span data-i18n="preview_saveAvif">Save as AVIF</span></button>
        <button id="btnOpen" class="btn btn-ghost" type="button"><svg class="icon icon-16" aria-hidden="true"><use href="../shared/assets/lucide-sprite.svg#external-link"/></svg> <span data-i18n="preview_openOriginal">Open original</span></button>
      </div>
    </div>
  </div>

  <script src="../shared/ui.js"></script>
  <script type="module" src="info.js"></script>
</body>
</html>
