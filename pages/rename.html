<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark light">
  <title data-i18n="rename_subtitle">ImgFetch, Rename before download</title>
  <script src="../shared/theme-init.js"></script>
  <link rel="stylesheet" href="../shared/ui.css">
  <style>
    body { max-width: 560px; margin: 0 auto; padding: 28px 20px 60px; }
    /* Brand header: larger mark, same shared .brand component as the editor. */
    .brand-mark { width: 40px; height: 40px; background: none; box-shadow: none; filter: none; border-radius: 0; }
    .brand-name { font-size: 18px; }
    .preview { width: 100%; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); max-height: 300px; object-fit: contain; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
    /* The format hint below the field uses the shared .field .hint rule
       in shared/ui.css; no page-local hint rule is needed. */
  </style>
</head>
<body>
  <div class="brand" style="margin-bottom:16px;">
    <img class="brand-mark" src="../shared/assets/brand-mark.svg" alt="" aria-hidden="true">
    <div>
      <div class="brand-name">ImgFetch</div>
      <div class="brand-sub" data-i18n="rename_subtitle">Name your download</div>
    </div>
  </div>

  <div class="card">
    <img id="preview" class="preview" data-i18n-attr="alt:preview_imagePreview" alt="Image preview">
    <div class="field" style="margin-top:12px;">
      <label for="filename" data-i18n="rename_filename">File name</label>
      <input type="text" id="filename" autocomplete="off" spellcheck="false">
      <div class="hint" id="formatHint"></div>
    </div>
    <div class="actions">
      <button id="btnSave" class="btn btn-primary" type="button"><svg class="icon icon-16" aria-hidden="true"><use href="../shared/assets/lucide-sprite.svg#download"/></svg> <span data-i18n="rename_download">Download</span></button>
      <button id="btnCancel" class="btn btn-ghost" type="button"><svg class="icon icon-16" aria-hidden="true"><use href="../shared/assets/lucide-sprite.svg#x"/></svg> <span data-i18n="ui_cancel">Cancel</span></button>
    </div>
  </div>

  <script src="../shared/ui.js"></script>
    <script src="rename.js"></script>
</body>
</html>
