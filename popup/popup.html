<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark light">
  <title data-i18n="appName">ImgFetch</title>
  <script src="../shared/theme-init.js"></script>
  <link rel="stylesheet" href="../shared/ui.css">
  <style>
    /* The popup is 400px wide, fixed. Do NOT cap it with max-width:
       100vw (or any viewport-relative width): Chrome sizes the real
       popup window from this fixed width, and a viewport cap shrinks
       the real popup to the initial viewport width (measured 228px,
       with the capture tiles and nav clipped) instead of 400px.
       In a narrower tab the page scrolls horizontally; that is the
       same behaviour as the shipped product. */
    html, body { width: 400px; height: 600px; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; background: var(--bg); position: sticky; top: 0; z-index: 10;
    }
    .topbar .brand-name { font-size: 15px; }
    .topbar .brand-mark { width: 28px; height: 28px; border-radius: 8px; }
    /* Mockup header shows the brand name only; the tagline stays in the
       markup (and in options/welcome) and is hidden here. */
    .topbar .brand-sub { display: none; }
    /* Segmented nav: one pill, three icon buttons, active icon highlighted.
       G2: the selected indicator slides on transform only (250 ms).
       The pill div is inserted by UI.initSlidingIndicators; without JS
       the pressed button keeps its own background, so the .has-pill
       rules only apply once the pill exists. */
    .popup-nav { display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; position: relative; }
    .popup-nav .icon-btn { width: 32px; height: 28px; min-width: 32px; min-height: 28px; border-radius: 7px; color: var(--faint); }
    .popup-nav .icon-btn:hover { background: var(--hover); color: var(--text); }
    .popup-nav .icon-btn[aria-pressed="true"] { background: var(--raised); color: var(--text); box-shadow: inset 0 0 0 1px var(--line2); }
    .popup-nav.has-pill .icon-btn { position: relative; z-index: 1; }
    .popup-nav.has-pill .icon-btn[aria-pressed="true"] { background: transparent; box-shadow: none; }
    /* Phase 5 A1: main scrolls, but shows no scrollbar chrome: the
       old 8px track/thumb sat at the window edge and read as a grey
       band, and the grid's -5px margins also forced a horizontal bar.
       Scrolling still works by wheel, touch and keyboard. The
       document itself never scrolls, so no browser-default strip can
       appear at any edge, at any DPR, in either theme. */
    main { overflow-x: hidden; overflow-y: auto; padding: 4px 16px 16px; flex: 1; scrollbar-width: none; scrollbar-color: var(--line2) var(--bg); }
    main::-webkit-scrollbar { width: 0; height: 0; }
    main::-webkit-scrollbar-track { background: var(--bg); }
    main::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 4px; }
    html { scrollbar-width: none; scrollbar-color: var(--line2) var(--bg); }
    html::-webkit-scrollbar { width: 0; height: 0; }
    html::-webkit-scrollbar-track { background: var(--bg); }
    html::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 4px; }
    /* Hero: viewfinder card with corner brackets and the fixed brand art. */
    .hero { text-align: start; padding: 0; }
    .hero-viewfinder {
      position: relative; height: 148px; border-radius: var(--r3);
      background: linear-gradient(180deg, var(--raised), var(--surface));
      border: 1px solid var(--line); overflow: hidden; display: grid; place-items: center;
    }
    .vf-corner { position: absolute; width: 18px; height: 18px; border: 2px solid var(--accent2); opacity: 0.9; }
    .vf-corner.tl { inset-inline-start: 12px; top: 12px; border-inline-end: 0; border-bottom: 0; border-start-start-radius: 6px; }
    .vf-corner.tr { inset-inline-end: 12px; top: 12px; border-inline-start: 0; border-bottom: 0; border-start-end-radius: 6px; }
    .vf-corner.bl { inset-inline-start: 12px; bottom: 12px; border-inline-end: 0; border-top: 0; border-end-start-radius: 6px; }
    .vf-corner.br { inset-inline-end: 12px; bottom: 12px; border-inline-start: 0; border-top: 0; border-end-end-radius: 6px; }
    .hero-stack { position: relative; width: 150px; height: 84px; }
    /* Hero art, Phase 5 A2: pure inline vector. The old img SVGs were
       rasterised to a bitmap first and then rotated on the wrapper, so
       the cut-out edges came out soft and stair-stepped. The same art
       now lives once as symbol defs at the top of the body and is
       instantiated with use: rotation applies to vector content, so
       it re-rasterises crisply at every DPR. Positions and angles are
       whole pixels and whole degrees, so nothing resamples. The
       shared/assets/hero-*.svg files stay as the canonical art. */
    .hero-art-wrap { position: absolute; width: 76px; height: 56px; }
    .hero-art { display: block; width: 76px; height: 56px; border-radius: 9px; border: 1px solid var(--line2); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); }
    .hero-art-left { inset-inline-start: 0; top: 14px; transform: rotate(-8deg); }
    .hero-art-right { inset-inline-start: 72px; top: 18px; transform: rotate(7deg); }
    .hero-art-center { inset-inline-start: 36px; top: 0; }
    .hero h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.45; margin: 14px 2px 0; }
    .pane-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.25; margin: 14px 2px 0; }
    /* Results title only: the shared .pane-title box (27.5px at 1.25) sits
       12px low and 4px short of the reference, so the title gets the
       reference line-height (1.45) and a 2px top margin; the toolbar gains
       8px on top so the chips and the grid stay where they were. */
    #resTitle { margin-top: 2px; line-height: 1.45; }
    .hero p { color: var(--muted); font-size: 13px; line-height: 1.45; margin: 2px 2px 0; }
    .pane-sub { color: var(--muted); font-size: 13px; margin: 2px 2px 0; line-height: 1.45; }
    #btnScan { margin-top: 14px; min-height: 44px; border-radius: var(--r2); font-size: 14px; }
    .popup-sec-label { margin: 18px 2px 8px; font-size: 11px; font-weight: 600; line-height: 1.45; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
    /* D1: screenshot group as one row of four icon buttons with labels. */
    .shot-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .shot-btn {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 16px 6px 14px; border: 1px solid var(--border); border-radius: 12px;
      background: var(--surface); color: var(--text); cursor: pointer;
      font-size: 12px; font-weight: 600; line-height: 1.45;
      /* G2: hover lift of 1 px, fast ease-out in, softer 250 ms settle
         out; press is a 0.98 scale over the micro duration (80 ms). */
      transition: border-color var(--duration-fast) var(--ease-smooth-out), background-color var(--duration-fast) var(--ease-smooth-out), transform var(--duration-fast) var(--ease-smooth-out);
    }
    .shot-btn:hover { border-color: var(--primary); background: var(--surface-2); transform: translateY(-1px); transition: border-color var(--duration-quick) var(--ease-out), background-color var(--duration-quick) var(--ease-out), transform var(--duration-quick) var(--ease-out); }
    .shot-btn:active { transform: scale(0.98); transition: border-color var(--duration-micro) var(--ease-smooth-out), background-color var(--duration-micro) var(--ease-smooth-out), transform var(--duration-micro) var(--ease-smooth-out); }
    .shot-btn:focus-visible { outline: none; box-shadow: var(--focus); }
    /* svg.icon outranks .icon-20, so capture icons render at 18px; the
       mockup uses 20px icons, which also restores the tile height. */
    .shot-btn svg { color: var(--accentText); width: 20px; height: 20px; }
    .shot-btn:disabled { opacity: 0.55; cursor: default; }
    /* Last scan: dashed row with the real host and count; the whole row
       opens the results, which is the old View results button behavior.
       The row itself has no top margin: #homeStatus already adds 14px
       above it, and the row's own 14px doubled the gap to 28px. */
    .last-scan-row {
      display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 0;
      padding: 10px 12px; border: 1px dashed var(--line2); border-radius: 10px;
      background: transparent; color: var(--faint); font: 500 12px var(--font);
      cursor: pointer; text-align: start;
      transition: background-color var(--duration-quick) var(--ease-smooth-out);
    }
    .last-scan-row:hover { background: var(--hover); }
    .last-scan-row .last-scan-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
    .last-scan-row .last-scan-text b { font-weight: 600; }
    .last-scan-row .last-scan-count { flex: none; font-variant-numeric: tabular-nums; color: var(--muted); }
    .last-scan-row .icon { width: 16px; height: 16px; color: var(--faint); }
    /* Scanning pane: same hero as home, found-so-far card, cancel. */
    .scan-found-card { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
    .scan-found-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); padding: 9px 10px; line-height: 1.45; }
    .scan-found-row b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
    #scanProgressWrap { height: 6px; margin-top: 10px; }
    #btnScanCancel { margin-top: 10px; min-height: 44px; border-radius: var(--r2); font-size: 14px; }
    /* Results: summary cards from real scan numbers, 4-column grid. */
    .res-summary { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 8px; margin-top: 14px; }
    .res-stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
    .res-stat b { display: block; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .res-stat span { font-size: 11.5px; color: var(--muted); }
    .res-stat-big { background: linear-gradient(180deg, rgba(34, 211, 160, 0.1), rgba(34, 211, 160, 0.03)); border-color: rgba(34, 211, 160, 0.25); }
    .res-stat-big b { color: var(--ok); }
    /* Phase 5 A8: the line reserves its space permanently (fixed
       height), so the chips and the grid never move when the line
       appears or disappears; the text swaps in and out instead. */
    .res-selected-size { font-size: 12.5px; color: var(--muted); padding: 10px 2px 0; font-variant-numeric: tabular-nums; height: 29px; overflow: hidden; white-space: nowrap; }
    .toolbar { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; margin-bottom: 8px; }
    .toolbar .row { flex-wrap: wrap; }
    /* Below-grid controls: orientation/sort, select all/none/invert,
       quality, best-quality checkbox, ZIP, Scan again. They stay fully
       working here; the first paint keeps the mockup's title, cards,
       chips, grid and Download / View all instead (see .footerbar). */
    .res-more { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
    .res-more .row { flex-wrap: wrap; }
    #grid { grid-template-columns: repeat(4, 1fr); }
    /* Phase 5 A1: the old -5px margins compensated for a 10px
       scrollbar that no longer exists; they also forced a horizontal
       scrollbar. The grid is the reference 368px (4 x 86px thumbs +
       3 x 8px gaps) with no offset. */
    .grid-wrap { margin: 4px 0; }
    /* Sticky footer: Download + View all only, the mockup's two buttons.
       The rest of the old footer (quality, best-quality checkbox, ZIP,
       Scan again) lives in .res-more below the grid, so this bar stays
       short and never covers the filter chips on first paint. */
    .footerbar {
      position: sticky; bottom: 0; z-index: 2; background: var(--bg); padding: 10px 16px 2px;
      border-top: 1px solid var(--border); margin-top: 10px; margin-inline: -16px;
      display: flex; flex-direction: column; gap: 8px;
    }
    /* Fade above the sticky bar: grid content fades out over 20px, then
       the solid bar background sits behind the buttons, so no cut
       thumbnail or border ever shows through behind them. */
    .footerbar::before {
      content: ""; position: absolute; inset-inline: 0; bottom: 100%; height: 20px;
      background: linear-gradient(180deg, transparent, var(--bg)); pointer-events: none;
    }
    /* Solid block under the sticky bar: main's 16px bottom padding leaves
       a strip below the bar where grid content shows through while
       scrolling. This paints that strip with the bar background without
       moving the bar or its buttons. The bar breaks out of main's side
       padding, so the strip runs at the viewport edges (inset-inline 0)
       and no grid sliver shows at the left or right edge. */
    .footerbar::after {
      content: ""; position: absolute; inset-inline: 0; top: 100%; height: 16px;
      background: var(--bg); pointer-events: none;
    }
    .footerbar .btn-block { min-height: 44px; border-radius: var(--r2); font-size: 14px; }
    #btnDownload { min-height: 44px; }
    #btnViewAll { min-height: 40px; }
    .q-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .q-item:last-child { border-bottom: 0; }
    .q-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
    .q-pending { background: var(--muted); }
    .q-active { background: var(--primary); animation: sx-pulse var(--duration-pulse) var(--ease-linear) infinite; }
    .q-done { background: var(--success); }
    .q-failed { background: var(--danger); }
    #homeStatus { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
    #homeStatus[hidden] { display: none; }
    /* Round 5: live full-page capture progress, one row under the
       shot buttons (never stacked toasts covering them). */
    #captureProgress { margin-top: 14px; text-align: start; }
    #captureProgress[hidden] { display: none; }
    .cp-row { display: flex; align-items: center; gap: 10px; }
    .cp-text { flex: 1; font-size: 13px; overflow-wrap: break-word; }
    .cp-bar { margin-top: 8px; height: 6px; }
    .status-card {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--surface); font-size: 13px;
    }
    .status-card-title { font-weight: 600; }
    .q-cancelled { background: var(--warning); }
    @keyframes sx-pulse { 50% { opacity: 0.4; } }
    /* History: sticky group headers with true counts, 40 px thumbnail tiles. */
    #viewHistory .spread { margin: 4px 2px 4px; }
    .hist-day { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-weight: 600; font-size: 11px; color: var(--faint); margin: 14px 2px 6px; padding: 6px 2px; text-transform: uppercase; letter-spacing: 0.08em; position: sticky; top: 0; background: var(--bg); z-index: 1; }
    .hist-day .hist-count { font-variant-numeric: tabular-nums; text-transform: none; letter-spacing: normal; }
    .hist-item { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 12px; font-size: 13px; transition: background-color var(--duration-quick) var(--ease-smooth-out); }
    .hist-item:hover, .hist-item:focus-within { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
    .hist-tile { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line2); background: var(--raised); color: var(--muted); display: grid; place-items: center; flex: none; overflow: hidden; position: relative; }
    .hist-tile .icon { width: 20px; height: 20px; }
    .hist-thumb { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; image-rendering: auto; display: block; }
    .hist-main { flex: 1; min-width: 0; }
    .hist-name { display: flex; align-items: center; font-size: 13.5px; font-weight: 600; overflow: hidden; white-space: nowrap; }
    .hist-name-text { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* Format badge: the small pill right after the filename
       (10px bold, 2px 6px, 5px radius, 6px gap). Height is 16px,
       measured from the approved history design
       (popup_history_v2_dark.png: PNG, GIF and JPG badges are all
       32 device px tall at 2x); the line-height stays at the .badge
       base of 1, so 10 + 4 padding + 2 border = 16. PNG, JPG, GIF
       and AVIF reuse the existing badge tints, which match the
       design's measured dark values (GIF exact; PNG and JPG within
       2 RGB units; all three texts exact); WebP uses a translucent
       cyan tint with lighter text. The design shows PNG, JPG and GIF. */
    .hist-fmt { flex: none; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; padding: 2px 6px; border-radius: 5px; margin-left: 6px; }
    /* WebP: a translucent cyan tint with lighter text, not the solid
       raised surface. Dark values are the reference's own; light
       uses the --cyan token so the text stays readable. */
    .hist-fmt-webp { color: var(--cyan); background: rgba(14, 116, 144, 0.12); border-color: transparent; }
    [data-theme="dark"] .hist-fmt-webp { color: #67e0f3; background: rgba(34, 211, 238, 0.13); }
    .hist-sub { font-size: 11.5px; color: var(--faint); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hist-side { display: grid; flex: none; }
    /* G2: hover action buttons fade in 150 ms, out 80 ms. The base
       rule is the out duration; the hover rule shortens nothing, it
       lengthens the in transition, so the return uses the base. */
    .hist-size { grid-area: 1 / 1; justify-self: end; align-self: center; font-size: 12px; color: var(--muted); text-align: end; font-variant-numeric: tabular-nums; transition: opacity var(--duration-micro) var(--ease-smooth-out); }
    .hist-actions { grid-area: 1 / 1; display: flex; gap: 4px; align-items: center; opacity: 0; pointer-events: none; transition: opacity var(--duration-micro) var(--ease-smooth-out); }
    .hist-item:hover .hist-size, .hist-item:focus-within .hist-size { opacity: 0; transition: opacity var(--duration-quick) var(--ease-smooth-out); }
    .hist-item:hover .hist-actions, .hist-item:focus-within .hist-actions { opacity: 1; pointer-events: auto; transition: opacity var(--duration-quick) var(--ease-smooth-out); }
    .hist-action { position: relative; }
    .hist-action .icon { width: 16px; height: 16px; }
    .hist-copied { position: absolute; top: calc(100% + 6px); inset-inline-end: 0; background: var(--raised); color: var(--text); border: 1px solid var(--line2); border-radius: 6px; padding: 3px 8px; font-size: 11px; font-weight: 600; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity var(--duration-micro) var(--ease-smooth-out); z-index: 2; }
    .hist-copied.is-visible { opacity: 1; transition: opacity var(--duration-quick) var(--ease-smooth-out); }
    #btnClearHistory.is-confirm { color: var(--danger); }
    .preview-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; margin: 10px 0; }
    .kv dt { color: var(--muted); } .kv dd { margin: 0; word-break: break-all; }
    select.inline { width: auto; padding: 6px 8px; font-size: 12px; }
  </style>
</head>

07" y="244.46914316735655" width="4" height="5" fill="#fde68a"/><rect x="270" y="258.46914316735655" width="4" height="5" fill="#1e293b"/><rect x="282.04653981563007" y="258.46914316735655" width="4" height="5" fill="#1e293b"/></symbol></defs></svg>
  <header class="topbar">
    <div class="brand">
      <img class="brand-mark" src="../icons/icon-32.png" alt="" aria-hidden="true">
      <div>
        <div class="brand-name">ImgFetch</div>
        <div class="brand-sub" data-i18n="appTagline">Smart Image Downloader</div>
      </div>
    </div>
    <nav class="popup-nav" data-i18n-attr="aria-label:popup_navAria" aria-label="ImgFetch navigation">
      <button id="navHome" class="icon-btn" data-i18n-attr="title:popup_home;aria-label:popup_home" title="Home" aria-label="Home" aria-pressed="true">
        <svg class="icon" aria-hidden="true"><use href="../shared/assets/lucide-sprite.svg#house"></use></svg>
      </button>
      <button id="navHistory" class="icon-btn" data-i18n-attr="title:popup_history;aria-label:popup_history" title="Download history" aria-label="Download history">
        <svg class="icon" aria-hidden="true"><use href="../shared/assets/lucide-sprite.svg#history"></use></svg>
      </button>
      <button id="navSettings" class="icon-btn" data-i18n-attr="title:popup_settings;aria-label:popup_settings" title="ImgFetch settings" aria-label="ImgFetch settings">
        <svg class="icon" aria-hidden="true"><use href="../shared/assets/lucide-sprite.svg#settings"></use></svg>
      </button>
    </nav>
  </header>

  <main class="pane-anim" id="viewHome" data-i18n-attr="aria-label:popup_home" aria-label="Home">
    <section class="pane-anim" id="paneIdle">
      <div class="hero">
        <div class="hero-viewfinder">
          <i class="vf-corner tl" aria-hidden="true"></i><i class="vf-corner tr" aria-hidden="true"></i><i class="vf-corner bl" aria-hidden="true"></i><i class="vf-corner br" aria-hidden="true"></i>
          <div class="hero-stack">
            <span class="hero-art-wrap hero-art-left"><svg class="hero-art" aria-hidden="true"><use href="#hero-g2"/></svg></span>
            <span class="hero-art-wrap hero-art-right"><svg class="hero-art" aria-hidden="true"><use href="#hero-g4"/></svg></span>
            <span class="hero-art-wrap hero-art-center"><svg class="hero-art" aria-hidden="true"><use href="#hero-g1"/></svg></span>
          </div>
        </div>
        <h1 data-i18n="popup_heroTitleNew">Find. Select. Download.</h1>
        <p data-i18n="popup_heroDescNew">Scan any page and save the best version of each image.</p>
        <button id="btnScan" class="btn btn-primary btn-block"><svg class="icon icon-16" aria-hidden="true"><use href="../shared/assets/lucide-sprite.svg#scan-search"></use></svg><span data-i18n="popup_scanButton">Scan this page</span></button>
        <div class="popup-sec-label" data-i18n="popup_captureLabel">Capture</div>
        <div class="shot-row" role="group" data-i18n-attr="aria-label:popup_screenshotGroup" aria-label="Screenshot">
          <button id="btnShotVisible" class="shot-btn" data-i18n-attr="title:popup_shotVisible;aria-label:popup_shotVisible" title="Capture visible page" aria-label="Capture visible page">
            <svg class="icon icon-20" aria-hidden="true"><use href="../shared/assets/lucide-sprite.svg#monitor"></use></svg>
            <span data-i18n="popup_shotVisibleLabel">Visible</span>
          </button>
          <button id="btnShotArea" class="shot-btn" data-i18n-attr="title:popup_shotArea;aria-label:popup_shotArea" title="Capture selected area" aria-label="Capture selected area">
            <svg class="icon icon-20" aria-hidden="true"><use href="../shared/assets/lucide-sprite.svg#scan"></use></svg>
            <span data-i18n="popup_shotAreaLabel">Area</span>
          </button>
          <button id="btnShotElement" class="shot-btn" data-i18n-attr="title:popup_shotElement;aria-label:popup_shotElement" title="Capture element" aria-label="Capture element">
            <svg class="icon icon-20" aria-hidden="true"><use href="../shared/assets/lucide-sprite.svg#mouse-pointer-click"></use></svg>
            <span data-i18n="popup_shotElementLabel">Element</span>
          </button>
          <button id="btnShotFull" class="shot-btn" data-i18n-attr="title:popup_shotFull;aria-label:popup_shotFull" title="Capture full page" aria-label="Capture full page">
            <svg class="icon icon-20" aria-hidden="true"><use href="../shared/assets/lucide-sprite.svg#gallery-vertical-end"></use></svg>
            <span data-i18n="popup_shotFullLabel">Full page</span>
          </button>
        </div>
        <div id="captureProgress" hidden>
          <div class="cp-row">
            <span id="captureProgressText" class="cp-text" role="status" aria-live="polite"></span>
            <button id="btnCaptureStop" class="btn btn-sm btn-danger" data-i18n="popup_captureStop">Stop</button>
          </div>
          <div class="progress cp-bar" id="captureProgressBarWrap" role="progressbar" data-i18n-attr="aria-label:popup_captureProgressAria" aria-label="Full-page capture progress" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0"><i id="captureProgressBar"></i></div>
        </div>
        <div id="homeStatus" hidden></div>
      </div>
    </section>

    <section class="pane-anim" id="paneScanning" hidden>
      <div class="hero-viewfinder">
        <i class="vf-corner tl" aria-hidden="true"></i><i class="vf-corner tr" aria-hidden="true"></i><i class="vf-corner bl" aria-hidden="true"></i><i class="vf-corner br" aria-hidden="true"></i>
        <div class="hero-stack">
          <span class="hero-art-wrap hero-art-left"><svg class="hero-art" aria-hidden="true"><use href="#hero-g2"/></svg></span>
          <span class="hero-art-wrap hero-art-right"><svg class="hero-art" aria-hidden="true"><use href="#hero-g4"/></svg></span>
          <span class="hero-art-wrap hero-art-center"><svg class="hero-art" aria-hidden="true"><use href="#hero-g1"/></svg></span>
        </div>
        <div class="scan-line" aria-hidden="true"></div>
      </div>
      <h1 class="pane-title" data-i18n="popup_scanningTitle">Scanning page…</h1>
      <p class="pane-sub" data-i18n="popup_scanningDesc">Looking for images, including backgrounds.</p>
      <div class="scan-found-card">
        <div class="scan-found-row"><span data-i18n="popup_scanFoundLabel">Found so far</span><b id="scanStatus" role="status" aria-live="polite"></b></div>
        <div class="progress" id="scanProgressWrap"><i id="scanBar"></i></div>
      </div>
      <button id="btnScanCancel" class="btn btn-ghost btn-block"><svg class="icon icon-16" aria-hidden="true"><use href="../shared/assets/lucide-sprite.svg#x"></use></svg><span data-i18n="ui_cancel">Cancel</span></button>
    </section>

    <section class="pane-anim" id="paneResults" hidden>
      <div class="spread">
        <div>
          <div class="pane-title" id="resTitle" data-i18n="popup_resultsTitle">Results</div>
          <div class="pane-sub" id="resSub"></div>
        </div>
      </div>
      <div id="resSummary" class="res-summary"></div>
      <div id="resSelectedSize" class="res-selected-size"></div>
      <div class="toolbar">
        <div class="row" id="formatChips" role="group" data-i18n-attr="aria-label:popup_formatFilterAria" aria-label="Format filter"></div>
      </div>
      <div id="grid" class="grid grid-wrap" role="group" data-i18n-attr="aria-label:popup_gridAria" aria-label="Found images"></div>
      <div class="res-more">
        <div class="row">
          <input type="text" id="search" data-i18n-attr="placeholder:popup_searchPlaceholder;aria-label:popup_searchPlaceholder" placeholder="Search images…" aria-label="Search images" style="flex:1;">
        </div>
        <div class="row" role="group" data-i18n-attr="aria-label:popup_sizeFilterAria" aria-label="Size filter">
          <button class="chip" data-size="any" aria-pressed="true" data-i18n="popup_sizeAny">Any size</button>
          <button class="chip" data-size="small" aria-pressed="false" data-i18n="popup_sizeSmall">&lt; 400px</button>
          <button class="chip" data-size="medium" aria-pressed="false" data-i18n="popup_sizeMedium">400px+</button>
          <button class="chip" data-size="large" aria-pressed="false" data-i18n="popup_sizeLarge">1200px+</button>
        </div>
        <div class="row">
          <select id="filterOrient" class="inline" data-i18n-attr="aria-label:popup_orientFilterAria" aria-label="Orientation filter">
            <option value="" data-i18n="popup_orientAny">Any orientation</option>
            <option value="landscape" data-i18n="popup_orientLandscape">Landscape</option>
            <option value="portrait" data-i18n="popup_orientPortrait">Portrait</option>
            <option value="square" data-i18n="popup_orientSquare">Square</option>
          </select>
          <select id="sortMode" class="inline" data-i18n-attr="aria-label:popup_sortAria" aria-label="Sort images">
            <option value="order" data-i18n="popup_sortOrder">Page order</option>
            <option value="largest" data-i18n="popup_sortLargest">Largest first</option>
            <option value="smallest" data-i18n="popup_sortSmallest">Smallest first</option>
          </select>
        </div>
        <div class="row small">
          <button id="selAll" class="btn btn-sm btn-ghost" data-i18n="popup_selAll">Select all</button>
          <button id="selNone" class="btn btn-sm btn-ghost" data-i18n="popup_selNone">Select none</button>
          <button id="selInvert" class="btn btn-sm btn-ghost" data-i18n="popup_selInvert">Invert</button>
          <span class="muted" id="resultCount" style="margin-inline-start:auto;"></span>
        </div>
        <div class="row">
          <div class="segmented" role="group" data-i18n-attr="aria-label:popup_qualityAria" aria-label="Download quality">
            <button id="qSmart" aria-pressed="true" data-i18n="popup_qualitySmart">Smart Download</button>
            <button id="qNormal" aria-pressed="false" data-i18n="popup_qualityNormal">As shown</button>
          </div>
          <select id="dlFormat" class="inline" data-i18n-attr="aria-label:popup_dlFormatAria" aria-label="Download format" style="margin-inline-start:auto;">
            <option value="as-is" data-i18n="popup_formatOriginal">Original format</option>
            <option value="png">PNG</option>
            <option value="jpg">JPG</option>
            <option value="webp">WebP</option>
            <option value="avif">AVIF</option>
          </select>
        </div>
        <div class="row">
          <label class="small" style="display:flex;align-items:center;gap:6px;cursor:pointer;">
            <input type="checkbox" id="bulkBest">
            <span data-i18n="popup_bulkBest" title="Probe each image for a higher-quality source before downloading. Slower, can trigger rate limits on some sites.">Try best quality for bulk download</span>
          </label>
        </div>
        <button id="btnZip" class="btn btn-ghost btn-block" data-i18n-attr="title:popup_downloadZipTitle" title="Pack the selected images into one .zip file, exactly as shown on the page (no Smart quality upgrade inside ZIPs)" data-i18n="popup_downloadZip">Download selected as ZIP</button>
        <button id="btnRescan" class="btn btn-ghost btn-block" data-i18n="popup_rescan">Scan again</button>
      </div>
      <div class="footerbar">
        <button id="btnDownload" class="btn btn-primary btn-block"><svg class="icon icon-16" aria-hidden="true"><use href="../shared/assets/lucide-sprite.svg#download"></use></svg><span id="btnDownloadLabel" data-i18n="popup_download">Download selected</span></button>
        <button id="btnViewAll" class="btn btn-ghost btn-block"><span id="btnViewAllLabel"></span></button>
      </div>
    </section>

    <section class="pane-anim" id="paneQueue" hidden>
      <h2 class="section-title" data-i18n="popup_queueTitle">Downloads</h2>
      <p class="section-desc" id="queueSummary" role="status" aria-live="polite" data-i18n="popup_queuePreparing">Preparing…</p>
      <div class="progress" style="margin-bottom:12px;"><i id="queueBar"></i></div>
      <div id="queueList"></div>
      <div class="row" style="margin-top:12px;">
        <button id="btnQueueRetry" class="btn btn-sm btn-ghost" data-i18n="popup_queueRetry">Retry failed</button>
        <button id="btnQueueCancel" class="btn btn-sm btn-danger" data-i18n="ui_cancel">Cancel</button>
        <button id="btnQueueClear" class="btn btn-sm btn-ghost" style="margin-inline-start:auto;" data-i18n="popup_queueClear">Clear finished</button>
      </div>
      <button id="btnBack" class="btn btn-ghost btn-block" style="margin-top:12px;" data-i18n="popup_backResults">Back to results</button>
    </section>
  </main>

  <main class="pane-anim" id="viewHistory" hidden data-i18n-attr="aria-label:popup_historyAria" aria-label="History">
    <div class="spread">
      <h2 class="section-title" style="margin:0;" data-i18n="popup_historyTitle">Download history</h2>
      <button id="btnClearHistory" class="btn btn-sm btn-ghost"><svg class="icon icon-16" aria-hidden="true"><use href="../shared/assets/lucide-sprite.svg#trash-2"></use></svg><span data-i18n="popup_historyClear">Clear</span></button>
    </div>
    <div id="historyList"></div>
  </main>

  <div id="modalRoot"></div>

  <script src="../shared/ui.js"></script>
